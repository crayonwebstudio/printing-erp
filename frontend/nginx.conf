# nginx server block for the printing-erp SPA. Pure static serving, plus
# proxying of /api and /health to the backend service.
#
# Upstream served static only and relied on the Ingress to route /api and
# /health to the API service. On Coolify the Traefik route points at this
# frontend container only, so those prefixes would otherwise hit nginx and
# return the SPA shell. These proxy locations keep the browser on a single
# origin, matching the Vite dev proxy in frontend/vite.config.ts.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Cheap nginx-level liveness ping (k8s app probes hit the backend's /health/*
    # through the Ingress; this only proves nginx itself is up).
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Backend API and health, proxied to the backend service on port 8080.
    # proxy_pass with no URI part preserves the original request path.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fingerprinted Vite bundles (default output dir /assets — no longer collides
    # with the backend, which now lives under /api). Immutable, so cache hard.
    # A miss here is a genuine 404, not the SPA shell.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unmatched paths return the app shell for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
